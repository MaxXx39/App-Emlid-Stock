# Fabrication automatique de l'appli Android (fichier APK) par GitHub.
# - À chaque envoi sur GitHub : tests du noyau + fabrication de l'APK (téléchargeable dans « Actions »).
# - Sur la branche principale (main) : l'APK est aussi publié dans « Releases »,
#   sous le nom « Dernière version », pour l'installer facilement depuis le téléphone.
name: Fabriquer l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du noyau et fabrication de l'APK
        run: ./gradlew --no-daemon :noyau:test :app:assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EmlidStock.apk

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: EmlidStock-apk
          path: EmlidStock.apk

      - name: Publier « Dernière version » (Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --cleanup-tag --yes || true
          gh release create derniere-version EmlidStock.apk \
            --target "${{ github.sha }}" \
            --title "Dernière version (n° ${{ github.run_number }})" \
            --notes "Appli Emlid Stock, version 0.1.${{ github.run_number }}. Sur le téléphone : touchez EmlidStock.apk pour le télécharger, puis ouvrez-le pour l'installer."
